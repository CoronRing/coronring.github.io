name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow a manual redeploy from the Actions tab without an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it, so a partially-uploaded artifact can't win the race.
concurrency:
  group: pages
  cancel-in-progress: false

# Every action here is on a major that runs on Node 24. The runners force
# Node-20 actions onto 24 anyway and warn about it, and that shim will not last.
#
# Two breaking changes in these majors were checked against this repo and do not
# apply: `checkout` v5+ tightened `pull_request_target` defaults, which nothing
# here triggers on, and `upload-pages-artifact` v4+ stopped including dotfiles,
# which `dist/` does not contain. If the build ever starts emitting one, pass
# `include-hidden-files: true` rather than reverting.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 20 is end-of-life; 22 is the active LTS and what `engines` allows.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `astro check` first — a type error fails the
      # deploy rather than shipping a broken page.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
