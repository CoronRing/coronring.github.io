name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow a manual redeploy from the Actions tab without an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it, so a partially-uploaded artifact can't win the race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `astro check` first — a type error fails the
      # deploy rather than shipping a broken page.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
