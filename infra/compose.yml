# Runtime stack on the Oracle host: the service, behind Caddy for TLS.
#
# Caddy exists because the personal website is served over HTTPS from
# github.io, and a page loaded over HTTPS cannot call an http:// backend —
# browsers block it as mixed content. So the API has to have a certificate,
# and a certificate needs a hostname rather than a bare IP.
#
# The hostname comes from sslip.io, which resolves 1-2-3-4.sslip.io to
# 1.2.3.4 for any address. That gives Let's Encrypt something to issue
# against without buying a domain. Point a real domain here later and only
# SITE_ADDRESS changes.

# Bounded container logs. Docker's json-file driver defaults to *unlimited*, so
# a long-lived container fills the disk eventually and the first symptom is the
# whole host failing rather than anything log-shaped. 10 MB x 3 caps each
# service at 30 MB, which at this traffic is far more than the 24 hours anyone
# actually reads back with `docker compose logs --since 24h`.
#
# Oracle's Unified Monitoring Agent is already running on the host, so these
# files are also what OCI Logging ingests if custom log collection is turned on
# for the instance — see infra/README.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    logging: *logging
    build:
      context: ./app
      dockerfile: Dockerfile
    image: particle-wave:local
    restart: unless-stopped
    # Two ARM cores and 12 GB on this host, shared with the chat service and
    # Caddy, so the sampler gets a ceiling rather than the whole box. Without a
    # limit an oversized conversion can OOM-kill its neighbours instead of
    # failing its own request, which turns one bad upload into an outage.
    mem_limit: 6g
    environment:
      # Two ARM cores, so two concurrent conversions. The sampler is
      # CPU-bound pure Python, the semaphore is per process, and this is
      # the only process. Was 3 on the 4-core host.
      PW_MAX_CONCURRENCY: '2'
      # Explicit rather than left at the 40 MP default. Peak memory scales
      # with pixel count across several intermediate float arrays, so on a
      # 12 GB box two concurrent 40 MP conversions is the shape of an OOM.
      # 24 MP is still a full-frame camera image.
      PW_MAX_IMAGE_PIXELS: '24000000'
      # The site, plus the Astro dev server so local work exercises the
      # real request path rather than silently falling back to the
      # in-browser tracer. The endpoint is open regardless of origin, so
      # naming localhost grants a developer nothing they did not have.
      PW_ALLOWED_ORIGINS: 'https://coronring.github.io,http://localhost:4321,http://127.0.0.1:4321'
      PW_TRUST_FORWARDED_FOR: '1'
      PW_LOG_LEVEL: 'info'
      PORT: '7860'
    expose:
      - '7860'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7860/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chat:
    logging: *logging
    build:
      context: ./chat
      dockerfile: Dockerfile
    image: site-chat:local
    restart: unless-stopped
    # The chat service is IO-bound: it holds a corpus and waits on the
    # provider. 2 GB is generous for that and leaves the sampler its room.
    mem_limit: 2g
    # The Gemini keys live here and nowhere else. `chat.env` is written onto
    # the host by `infra/configure.py` from the operator's local .env, mode
    # 0600, and is not in the repo — which is why this is an env_file rather
    # than an `environment:` block like everything below it.
    env_file:
      - ./chat.env
    environment:
      # Fetched from the published site, so content changes reach the
      # assistant without redeploying this container.
      CHAT_CORPUS_URL: 'https://coronring.github.io/corpus.json'
      CHAT_CORPUS_REFRESH_S: '900'
      CHAT_ALLOWED_ORIGINS: 'https://coronring.github.io,http://localhost:4321,http://127.0.0.1:4321'
      CHAT_TRUST_FORWARDED_FOR: '1'
      CHAT_LOG_LEVEL: 'info'
      PORT: '7870'
    expose:
      - '7870'
    healthcheck:
      # /api/health answers `degraded` rather than failing when the corpus or
      # the keys are missing, so this probes liveness only. A container that is
      # up and honestly reporting a misconfiguration should not be restarted in
      # a loop — the logs say what is wrong and a restart will not fix it.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7870/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  news:
    logging: *logging
    build:
      context: ./news
      dockerfile: Dockerfile
    image: newsring-subscriptions:local
    restart: unless-stopped
    # Smaller than either neighbour. It holds no corpus and no image buffers:
    # a SQLite file, one fetched digest, and an SMTP session.
    mem_limit: 512m
    # The mailbox password, the link-signing secret, the broadcast token, and
    # the Supabase project the subscriber list lives in. `news.env` is written
    # onto the host by `infra/configure.py` from the operator's local .env,
    # mode 0600, and is not in the repo — same arrangement as `chat.env` above.
    env_file:
      - ./news.env
    environment:
      # NewsRing renders the whole message once and publishes it here, so this
      # service never needs to know what a digest looks like.
      NEWS_DIGEST_URL: 'https://coronring.github.io/NewsRing/broadcast_today.json'
      # Its own public URL, including the prefix Caddy mounts it at. Links in
      # email are built from this and cannot be inferred from a request,
      # because `handle_path` has already stripped the prefix by then.
      NEWS_PUBLIC_BASE: 'https://129-146-25-154.sslip.io/news'
      NEWS_SITE_URL: 'https://coronring.github.io/newsring'
      NEWS_ALLOWED_ORIGINS: 'https://coronring.github.io,http://localhost:4321,http://127.0.0.1:4321'
      # Capped deliberately low: the mailbox behind this is an ordinary
      # consumer account. Raising it is a decision to move to a real sending
      # service first — see news/README.md.
      NEWS_MAX_SUBSCRIBERS: '50'
      # One table in the site's own Supabase project, named for the project
      # that owns it. The URL and key come from news.env, because together
      # they are a credential; this is only a name.
      NEWS_SUPABASE_TABLE: 'newsring_subscribers'
      NEWS_TRUST_FORWARDED_FOR: '1'
      NEWS_LOG_LEVEL: 'info'
      PORT: '7880'
    volumes:
      # Where the subscriber list falls back to when Supabase is not
      # configured. A named volume survives `docker compose down` and every
      # redeploy, but not the host itself being reclaimed — which is why the
      # list belongs in Postgres and `/api/health` reports which backend
      # actually answered.
      - news_data:/data
    expose:
      - '7880'
    healthcheck:
      # As with chat: /api/health answers `degraded` rather than failing when
      # a variable is unset, so this probes liveness only. Restarting a
      # container that is honestly reporting a misconfiguration fixes nothing.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7880/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The service that exists so the other three still exist next month. Oracle
  # reclaims Always Free compute it judges idle, and this deployment is idle by
  # any honest measure: a personal site's API answers a handful of requests a
  # day. The box was taken once already, on 2026-11-16, with everything on it.
  #
  # It raises CPU and memory past the published thresholds and leaves network
  # alone — see infra/keepalive/keepalive.py for which numbers and why, and
  # infra/README.md for what to do instead if this ever feels like too much.
  keepalive:
    logging: *logging
    build:
      context: ./keepalive
      dockerfile: Dockerfile
    image: keepalive:local
    restart: unless-stopped
    # Above the ballast ceiling (KEEPALIVE_MEMORY_CAP_MB, 3584) with room for
    # the interpreter, so the cap in the script is what actually binds and this
    # is only a backstop. A 1 GB micro never gets near either: the top-up
    # arithmetic finds no gap to fill and the ballast stays at zero.
    mem_limit: 4g
    # If this host ever runs out of memory, this process is the right one to
    # lose. It holds nothing anybody wants and comes back on its own; the
    # alternative is the kernel picking a converter mid-request.
    oom_score_adj: 1000
    environment:
      # Oracle's bar is 20% over a 7-day window, on all three of CPU, network
      # and memory at once. Clearing any one of them is enough, and these clear
      # two. Raise KEEPALIVE_BUSY_S if a future shape makes 90s in 600s thin.
      KEEPALIVE_MEMORY_TARGET: '0.30'
      KEEPALIVE_MEMORY_CAP_MB: '3584'
      KEEPALIVE_BUSY_S: '90'
      KEEPALIVE_PERIOD_S: '600'
      KEEPALIVE_WORKERS: '1'
      # Set to 0 on a host with real traffic, or after upgrading the account to
      # Pay As You Go, where idle reclamation stops applying.
      KEEPALIVE_ENABLED: '1'
    healthcheck:
      # The age of the stamp file, not the presence of the process. A wedged
      # loop keeps its PID and stops doing the one thing it is for, which is
      # exactly the failure this container would otherwise hide.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import sys,time;sys.exit(0 if time.time()-float(open('/tmp/keepalive.alive').read())<300 else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - app
      - chat
      - news
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes so the issued certificate survives a recreate. Without
      # this every redeploy asks Let's Encrypt for a new one and walks into
      # the rate limit.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  news_data:
